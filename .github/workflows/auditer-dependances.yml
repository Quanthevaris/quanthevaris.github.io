name: Auditer les dépendances

on:
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "_maintenance/requirements.txt"
      - "_maintenance/package*.json"
      - "assets/code/assistant-ia/requirements.txt"
      - ".github/workflows/auditer-dependances.yml"
  push:
    branches: [main, "arena/**"]
    paths:
      - "_maintenance/requirements.txt"
      - "_maintenance/package*.json"
      - "assets/code/assistant-ia/requirements.txt"
      - ".github/workflows/auditer-dependances.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Auditer les paquets Python déclarés et leurs dépendances résolues
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --vulnerability-service pypi -r _maintenance/requirements.txt -r assets/code/assistant-ia/requirements.txt
      - name: Auditer les outils Node sans scripts d’installation
        run: |
          npm ci --prefix _maintenance --ignore-scripts --no-fund --no-audit
          npm audit --prefix _maintenance
