name: Vérifier le site et le guide IA

on:
  pull_request:
  push:
    branches: [main, "arena/**"]
    paths:
      - "*.html"
      - "*.pdf"
      - "sitemap.xml"
      - "js/**"
      - "css/**"
      - "assets/code/**"
      - "assets/pdf/**"
      - "_audience/**"
      - "_maintenance/**"
      - ".github/workflows/verifier-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Installer les dépendances de contrôle (aucun modèle)
        run: python -m pip install -r _maintenance/requirements.txt -r assets/code/assistant-ia/requirements.txt
      - name: Vérifier le site, l’audience et le code sans vrai modèle
        run: |
          python _maintenance/test-securite.py
          python _maintenance/securiser-pages.py --check
          python _maintenance/test-site.py
          node --test _audience/test-audience.mjs
          python -m unittest discover -s assets/code/assistant-ia -v
          python _maintenance/test-livraison-ia.py
          python _maintenance/test-editorial.py
          node --check js/audience.js
          node --check js/script.js
          node --check js/impression-guide.js
          node --check assets/code/assistant-ia/assistant.js
          git diff --check
